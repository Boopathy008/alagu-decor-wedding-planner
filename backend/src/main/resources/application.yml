server:
  port: ${PORT:8080}

spring:
  application:
    name: alagu-decor-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres.liszotiorqqcbuwhwbvu}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:Azhagu1supa}}
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

